<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Customer - Drive Easy</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #172554;
        }

        .dashboard {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: #172554;
            color: white;
            padding: 25px 15px;
            flex-shrink: 0;
        }

        /* Full Project Logo */
        .logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ff6b00, #ff9f1c);
            border-radius: 14px 5px 14px 5px;
            font-size: 30px;
            box-shadow: 0 5px 15px rgba(255, 107, 0, 0.35);
        }

        .logo-title {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 12px;
            font-size: 23px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .drive, .easy {
            color: white;
        }

        .bolt {
            color: #ff9f1c;
        }

        .logo-line {
            width: 90%;
            height: 3px;
            margin-top: 5px;
            background: linear-gradient(90deg, #ff6b00, #06b6d4);
            border-radius: 10px;
        }

        .logo-subtitle {
            margin-top: 6px;
            font-size: 9px;
            font-weight: bold;
            letter-spacing: 1.5px;
            color: #cbd5e1;
        }

        /* Sidebar Heading */
        .sidebar h2 {
            font-size: 18px;
            text-align: center;
            margin-bottom: 20px;
            color: #06b6d4;
        }

        /* Sidebar Links */
        .sidebar a {
            display: block;
            text-decoration: none;
            color: #e2e8f0;
            padding: 13px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            font-size: 14px;
            transition: 0.3s;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #ff6b00;
            color: white;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 25px 30px;
            min-width: 0;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #cbd5e1;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .topbar h3 {
            font-size: 22px;
            color: #172554;
        }

        .admin-name {
            color: #ff6b00;
            font-weight: bold;
        }

        /* Page Heading */
        .page-heading {
            font-size: 30px;
            margin-bottom: 20px;
        }

        /* Form Panel */
        .form-panel {
            background: white;
            padding: 25px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        .customer-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* Form Fields */
        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 7px;
            color: #172554;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #64748b;
            border-radius: 7px;
            font-size: 13px;
            outline: none;
            color: #172554;
            background: white;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #ff6b00;
        }

        .address {
            grid-column: 1 / 3;
        }

        .address textarea {
            height: 100px;
            resize: vertical;
        }

        /* Form Buttons */
        .form-buttons {
            grid-column: 1 / 3;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .save-btn,
        .cancel-btn {
            padding: 11px 25px;
            border: none;
            border-radius: 7px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .save-btn {
            background: #ff6b00;
            color: white;
        }

        .save-btn:hover {
            background: #172554;
        }

        .cancel-btn {
            background: #e2e8f0;
            color: #172554;
        }

        .cancel-btn:hover {
            background: #cbd5e1;
        }

        /* Responsive Design */
        @media (max-width: 1000px) {
            .main-content {
                padding: 25px 20px;
            }
        }

        @media (max-width: 650px) {
            .dashboard {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .sidebar nav {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 5px;
            }

            .sidebar a {
                text-align: center;
                margin: 0;
            }

            .main-content {
                padding: 20px 15px;
            }

            .page-heading {
                font-size: 25px;
            }

            .customer-form {
                grid-template-columns: 1fr;
            }

            .address,
            .form-buttons {
                grid-column: 1;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <!-- Sidebar -->
        <aside class="sidebar">

            <!-- Full Drive Easy Logo -->
            <div class="logo">

                <div class="logo-icon">🚗</div>

                <div class="logo-title">
                    <span class="drive">DRIVE</span>
                    <span class="bolt">⚡</span>
                    <span class="easy">EASY</span>
                </div>

                <div class="logo-line"></div>

                <div class="logo-subtitle">
                    VEHICLE RENTAL SYSTEM
                </div>

            </div>

            <h2>ADMIN PANEL</h2>

            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="vehicles.html">Vehicles</a>
                <a href="bookings.html">Bookings</a>
                <a href="customers.html" class="active">Customers</a>
                <a href="payments.html">Payments</a>
                <a href="reports.html">Reports</a>
                <a href="settings.html">Settings</a>
                <a href="logout.html">Logout</a>
            </nav>

        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <div class="topbar">
                <h3>Add New Customer</h3>
                <span class="admin-name">Admin</span>
            </div>

            <h1 class="page-heading">Add New Customer</h1>

            <!-- Customer Form -->
            <section class="form-panel">

                <form class="customer-form" id="customerForm" novalidate>

                    <div class="form-group">
                        <label>Customer Name</label>
                        <input type="text" id="customerName"
                            placeholder="Enter Customer Name">
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email"
                            placeholder="Enter Email Address">
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="phone"
                            placeholder="Enter Phone Number"
                            pattern="[0-9]{10}"
                            maxlength="10">
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="password"
                            placeholder="Enter Password">
                    </div>

                    <div class="form-group">
                        <label>Gender</label>
                        <select id="gender">
                            <option value="">Select Gender</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Customer Status</label>
                        <select id="status">
                            <option value="">Select Status</option>
                            <option>Active</option>
                            <option>Inactive</option>
                        </select>
                    </div>

                    <div class="form-group address">
                        <label>Address</label>
                        <textarea id="address"
                            placeholder="Enter Customer Address"></textarea>
                    </div>

                    <!-- Buttons -->
                    <div class="form-buttons">

                        <button type="submit" class="save-btn">
                            SAVE
                        </button>

                        <button type="button" class="cancel-btn"
                            onclick="location.href='customers.html'">
                            CANCEL
                        </button>

                    </div>

                </form>

            </section>

        </main>

    </div>

    <!-- JavaScript -->
    <script>

        document.getElementById("customerForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                // Get field values
                const name = document.getElementById("customerName").value.trim();
                const email = document.getElementById("email").value.trim();
                const phone = document.getElementById("phone").value.trim();
                const password = document.getElementById("password").value;
                const gender = document.getElementById("gender").value;
                const status = document.getElementById("status").value;
                const address = document.getElementById("address").value.trim();

                // Customer Name Validation
                if (name === "") {
                    alert("Please enter customer name.");
                    return;
                }

                if (!/^[A-Za-z\s.'-]+$/.test(name)) {
                    alert("Please enter a valid customer name.");
                    return;
                }

                // Email Validation
                if (email === "") {
                    alert("Please enter email address.");
                    return;
                }

                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    alert("Please enter a valid email address.");
                    return;
                }

                // Phone Number Validation
                if (phone === "") {
                    alert("Please enter phone number.");
                    return;
                }

                if (!/^[0-9]{10}$/.test(phone)) {
                    alert("Phone number must contain exactly 10 digits.");
                    return;
                }

                // Password Validation
                if (password.trim() === "") {
                    alert("Please enter password.");
                    return;
                }

                if (password.length < 6) {
                    alert("Password must contain at least 6 characters.");
                    return;
                }

                // Gender Validation
                if (gender === "") {
                    alert("Please select gender.");
                    return;
                }

                // Customer Status Validation
                if (status === "") {
                    alert("Please select customer status.");
                    return;
                }

                // Address Validation
                if (address === "") {
                    alert("Please enter customer address.");
                    return;
                }

                alert("Customer details saved successfully!");

                window.location.href = "customers.html";

            });

    </script>

</body>
</html>
