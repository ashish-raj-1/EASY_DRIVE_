<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports & Analytics - Drive Easy</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #172554;
        }

        .dashboard {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: #172554;
            color: white;
            padding: 25px 15px;
            flex-shrink: 0;
        }

        /* Full Project Logo */
        .logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ff6b00, #ff9f1c);
            border-radius: 14px 5px 14px 5px;
            font-size: 30px;
            box-shadow: 0 5px 15px rgba(255, 107, 0, 0.35);
        }

        .logo-title {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 12px;
            font-size: 23px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .drive,
        .easy {
            color: white;
        }

        .bolt {
            color: #ff9f1c;
        }

        .logo-line {
            width: 90%;
            height: 3px;
            margin-top: 5px;
            background: linear-gradient(90deg, #ff6b00, #06b6d4);
            border-radius: 10px;
        }

        .logo-subtitle {
            margin-top: 6px;
            font-size: 9px;
            font-weight: bold;
            letter-spacing: 1.5px;
            color: #cbd5e1;
        }

        /* Sidebar Heading */
        .sidebar h2 {
            font-size: 18px;
            text-align: center;
            margin-bottom: 20px;
            color: #06b6d4;
        }

        /* Sidebar Links */
        .sidebar a {
            display: block;
            text-decoration: none;
            color: #e2e8f0;
            padding: 13px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            font-size: 14px;
            transition: 0.3s;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #ff6b00;
            color: white;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 25px 30px;
            min-width: 0;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #cbd5e1;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .admin-name {
            color: #ff6b00;
            font-weight: bold;
            font-size: 18px;
        }

        /* Page Heading */
        .page-heading {
            font-size: 30px;
            margin-bottom: 20px;
        }

        /* Report Filters */
        .filter-section {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }

        .filter-section select,
        .filter-section input {
            padding: 11px;
            border: 1px solid #64748b;
            border-radius: 7px;
            background: white;
            color: #172554;
            font-size: 13px;
            outline: none;
        }

        .filter-section select {
            width: 150px;
        }

        .filter-section input {
            width: 160px;
        }

        .filter-section select:focus,
        .filter-section input:focus {
            border-color: #ff6b00;
        }

        .generate-btn {
            padding: 11px 22px;
            background: #ff6b00;
            color: white;
            border: none;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .generate-btn:hover {
            background: #172554;
        }

        /* Chart Panel */
        .chart-panel {
            background: white;
            padding: 25px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 900px;
        }

        .chart-panel h2 {
            font-size: 21px;
            margin-bottom: 25px;
            color: #172554;
        }

        /* Bar Chart */
        .chart {
            height: 270px;
            display: flex;
            align-items: flex-end;
            justify-content: space-evenly;
            gap: 15px;
            padding: 10px 15px 0;
            border-bottom: 1px solid #cbd5e1;
        }

        .bar {
            width: 45px;
            max-width: 10%;
            background: linear-gradient(to top, #ff6b00, #ff9f1c);
            border-radius: 6px 6px 0 0;
            transition: height 0.4s;
        }

        .bar:hover {
            background: linear-gradient(to top, #172554, #06b6d4);
        }

        .chart-labels {
            display: flex;
            justify-content: space-evenly;
            gap: 15px;
            padding: 10px 15px 0;
            color: #64748b;
            font-size: 12px;
            text-align: center;
        }

        .chart-labels span {
            width: 45px;
        }

        /* Responsive Design */
        @media (max-width: 1000px) {
            .main-content {
                padding: 25px 20px;
            }
        }

        @media (max-width: 650px) {
            .dashboard {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .sidebar nav {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 5px;
            }

            .sidebar a {
                text-align: center;
                margin: 0;
            }

            .main-content {
                padding: 20px 15px;
            }

            .page-heading {
                font-size: 25px;
            }

            .filter-section input,
            .filter-section select {
                width: 100%;
            }

            .generate-btn {
                width: 100%;
            }

            .chart-panel {
                padding: 15px;
            }

            .chart {
                gap: 8px;
                padding-left: 0;
                padding-right: 0;
            }

            .bar {
                width: 25px;
            }

            .chart-labels {
                gap: 8px;
                padding-left: 0;
                padding-right: 0;
                font-size: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <!-- Sidebar -->
        <aside class="sidebar">

            <!-- Full Drive Easy Logo -->
            <div class="logo">

                <div class="logo-icon">🚗</div>

                <div class="logo-title">
                    <span class="drive">DRIVE</span>
                    <span class="bolt">⚡</span>
                    <span class="easy">EASY</span>
                </div>

                <div class="logo-line"></div>

                <div class="logo-subtitle">
                    VEHICLE RENTAL SYSTEM
                </div>

            </div>

            <h2>ADMIN PANEL</h2>

           <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="vehicles.html">Vehicles</a>
                <a href="bookings.html">Bookings</a>
                <a href="customers.html">Customers</a>
                <a href="payments.html">Payments</a>
                <a href="reports.html" class="active">Reports</a>
                <a href="settings.html">Settings</a>
                <a href="logout.html">Logout</a>
            </nav>

        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <div class="topbar">
                <h3>Reports & Analytics</h3>
                <span class="admin-name">Admin</span>
            </div>

            <h1 class="page-heading">Reports & Analytics</h1>

            <!-- Report Filters -->
            <div class="filter-section">

                <select id="reportType">
                    <option value="booking">Booking Report</option>
                    <option value="revenue">Revenue Report</option>
                </select>

                <input type="date" id="fromDate">

                <input type="date" id="toDate">

                <button class="generate-btn" onclick="generateReport()">
                    Generate
                </button>

            </div>

            <!-- Chart Panel -->
            <section class="chart-panel">

                <h2 id="chartTitle">Booking / Revenue Chart</h2>

                <div class="chart" id="chart">

                    <div class="bar" style="height: 35%;"></div>
                    <div class="bar" style="height: 55%;"></div>
                    <div class="bar" style="height: 42%;"></div>
                    <div class="bar" style="height: 75%;"></div>
                    <div class="bar" style="height: 60%;"></div>
                    <div class="bar" style="height: 90%;"></div>
                    <div class="bar" style="height: 65%;"></div>
                    <div class="bar" style="height: 82%;"></div>

                </div>

                <div class="chart-labels">
                    <span>Jan</span>
                    <span>Feb</span>
                    <span>Mar</span>
                    <span>Apr</span>
                    <span>May</span>
                    <span>Jun</span>
                    <span>Jul</span>
                    <span>Aug</span>
                </div>

            </section>

        </main>

    </div>

    <!-- JavaScript -->
    <script>

        function generateReport() {

            let reportType = document.getElementById("reportType").value;

            let fromDate = document.getElementById("fromDate").value;

            let toDate = document.getElementById("toDate").value;

            if (fromDate && toDate && fromDate > toDate) {
                alert("To Date must be after From Date.");
                return;
            }

            let title = document.getElementById("chartTitle");

            if (reportType === "booking") {
                title.innerText = "Booking Report Chart";
            } else {
                title.innerText = "Revenue Report Chart";
            }

            alert("Report generated successfully!");

        }

    </script>

</body>

</html>
