
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Drive Easy</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #172554;
        }

        .dashboard {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: #172554;
            color: white;
            padding: 25px 15px;
            flex-shrink: 0;
        }

        /* Full Project Logo */
        .logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ff6b00, #ff9f1c);
            border-radius: 14px 5px 14px 5px;
            font-size: 30px;
            box-shadow: 0 5px 15px rgba(255, 107, 0, 0.35);
        }

        .logo-title {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 12px;
            font-size: 23px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .drive,
        .easy {
            color: white;
        }

        .bolt {
            color: #ff9f1c;
        }

        .logo-line {
            width: 90%;
            height: 3px;
            margin-top: 5px;
            background: linear-gradient(90deg, #ff6b00, #06b6d4);
            border-radius: 10px;
        }

        .logo-subtitle {
            margin-top: 6px;
            font-size: 9px;
            font-weight: bold;
            letter-spacing: 1.5px;
            color: #cbd5e1;
        }

        /* Sidebar Heading */
        .sidebar h2 {
            font-size: 18px;
            text-align: center;
            margin-bottom: 20px;
            color: #06b6d4;
        }

        /* Sidebar Links */
        .sidebar a {
            display: block;
            text-decoration: none;
            color: #e2e8f0;
            padding: 13px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            font-size: 14px;
            transition: 0.3s;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #ff6b00;
            color: white;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 25px 30px;
            min-width: 0;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #cbd5e1;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .topbar h3 {
            font-size: 22px;
            color: #172554;
        }

        .admin-name {
            color: #ff6b00;
            font-weight: bold;
            font-size: 18px;
        }

        /* Page Heading */
        .page-heading {
            font-size: 30px;
            margin-bottom: 20px;
        }

        /* Settings Panel */
        .settings-panel {
            background: white;
            padding: 25px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
            max-width: 900px;
        }

        .settings-panel h2 {
            font-size: 21px;
            margin-bottom: 20px;
            color: #172554;
        }

        /* Settings Form */
        .settings-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-group {
            display: grid;
            grid-template-columns: 220px 1fr;
            align-items: center;
            gap: 15px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: bold;
            color: #172554;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #64748b;
            border-radius: 7px;
            outline: none;
            font-size: 13px;
            color: #172554;
            background: white;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #ff6b00;
        }

        /* Save Button */
        .button-section {
            display: flex;
            justify-content: flex-end;
            margin-top: 15px;
        }

        .save-btn {
            background: #ff6b00;
            color: white;
            padding: 12px 22px;
            border: none;
            border-radius: 7px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .save-btn:hover {
            background: #172554;
        }

        /* Responsive Design */
        @media (max-width: 1000px) {
            .main-content {
                padding: 25px 20px;
            }

            .form-group {
                grid-template-columns: 150px 1fr;
            }
        }

        @media (max-width: 650px) {
            .dashboard {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .sidebar nav {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 5px;
            }

            .sidebar a {
                text-align: center;
                margin: 0;
            }

            .main-content {
                padding: 20px 15px;
            }

            .page-heading {
                font-size: 25px;
            }

            .form-group {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .button-section {
                justify-content: stretch;
            }

            .save-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <!-- Sidebar -->
        <aside class="sidebar">

            <!-- Full Drive Easy Logo -->
            <div class="logo">

                <div class="logo-icon">🚗</div>

                <div class="logo-title">
                    <span class="drive">DRIVE</span>
                    <span class="bolt">⚡</span>
                    <span class="easy">EASY</span>
                </div>

                <div class="logo-line"></div>

                <div class="logo-subtitle">
                    VEHICLE RENTAL SYSTEM
                </div>

            </div>

            <h2>ADMIN PANEL</h2>

            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="vehicles.html">Vehicles</a>
                <a href="bookings.html">Bookings</a>
                <a href="customers.html">Customers</a>
                <a href="payments.html">Payments</a>
                <a href="reports.html">Reports</a>
                <a href="settings.html" class="active">Settings</a>
                <a href="logout.html">Logout</a>
            </nav>

        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <div class="topbar">
                <h3>Settings</h3>
                <span class="admin-name">Admin</span>
            </div>

            <h1 class="page-heading">Settings</h1>

            <!-- Settings Panel -->
            <section class="settings-panel">

                <h2>System Settings</h2>

                <form class="settings-form" id="settingsForm" novalidate>

                    <div class="form-group">
                        <label for="adminName">Admin Name</label>
                        <input type="text" id="adminName" value="Administrator">
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" value="admin@example.com">
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone" value="+91 9876543210">
                    </div>

                    <div class="form-group">
                        <label for="company">Company</label>
                        <input type="text" id="company" value="Vehicle Rental System">
                    </div>

                    <div class="form-group">
                        <label for="currency">Currency</label>
                        <select id="currency">
                            <option value="INR">INR (₹)</option>
                            <option value="USD">USD ($)</option>
                            <option value="EUR">EUR (€)</option>
                            <option value="GBP">GBP (£)</option>
                        </select>
                    </div>

                    <div class="button-section">
                        <button type="submit" class="save-btn">
                            SAVE CHANGES
                        </button>
                    </div>

                </form>

            </section>

        </main>

    </div>

    <!-- JavaScript -->
    <script>

        document.getElementById("settingsForm")
            .addEventListener("submit", function (event) {

                event.preventDefault();

                let adminName =
                    document.getElementById("adminName").value.trim();

                let email =
                    document.getElementById("email").value.trim();

                let phone =
                    document.getElementById("phone").value.trim();

                let company =
                    document.getElementById("company").value.trim();

                let currency =
                    document.getElementById("currency").value;

                // Admin Name Validation
                if (adminName === "") {
                    alert("Please enter admin name!");
                    return;
                }

                // Email Validation
                let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                if (email === "") {
                    alert("Please enter email!");
                    return;
                }

                if (!emailPattern.test(email)) {
                    alert("Please enter a valid email address!");
                    return;
                }

                // Phone Validation
                let phoneNumber = phone.replace(/[\s-]/g, "");
                let phonePattern = /^(?:\+91)?[6-9][0-9]{9}$/;

                if (phone === "") {
                    alert("Please enter phone number!");
                    return;
                }

                if (!phonePattern.test(phoneNumber)) {
                    alert("Please enter a valid 10-digit Indian mobile number!");
                    return;
                }

                // Company Validation
                if (company === "") {
                    alert("Please enter company name!");
                    return;
                }

                // Currency Validation
                if (currency === "") {
                    alert("Please select currency!");
                    return;
                }

                localStorage.setItem("adminName", adminName);
                localStorage.setItem("adminEmail", email);
                localStorage.setItem("adminPhone", phone);
                localStorage.setItem("company", company);
                localStorage.setItem("currency", currency);

                alert("Settings saved successfully!");

            });

        // Load previously saved settings
        window.onload = function () {

            if (localStorage.getItem("adminName")) {
                document.getElementById("adminName").value =
                    localStorage.getItem("adminName");
            }

            if (localStorage.getItem("adminEmail")) {
                document.getElementById("email").value =
                    localStorage.getItem("adminEmail");
            }

            if (localStorage.getItem("adminPhone")) {
                document.getElementById("phone").value =
                    localStorage.getItem("adminPhone");
            }

            if (localStorage.getItem("company")) {
                document.getElementById("company").value =
                    localStorage.getItem("company");
            }

            if (localStorage.getItem("currency")) {
                document.getElementById("currency").value =
                    localStorage.getItem("currency");
            }

        };

    </script>

</body>

</html>
