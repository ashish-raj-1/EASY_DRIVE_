
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Vehicle Rental System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            color: #333;
        }

        /* Header */
        header {
            width: 92%;
            margin: 20px auto;
            padding: 12px 25px;
            background: white;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            position: sticky;
            top: 15px;
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ff6b00, #ff9f1c);
            border-radius: 14px 5px 14px 5px;
            font-size: 25px;
            box-shadow: 0 5px 15px rgba(255, 107, 0, 0.35);
            transform: rotate(-3deg);
        }

        .logo-text {
            line-height: 1;
        }

        .logo-title {
            font-size: 23px;
            font-weight: 900;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .drive {
            color: #172554;
        }

        .bolt {
            color: #ff6b00;
        }

        .easy {
            color: #06b6d4;
        }

        .logo-line {
            width: 100%;
            height: 3px;
            margin-top: 5px;
            background: linear-gradient(90deg, #ff6b00, #06b6d4);
            border-radius: 10px;
        }

        .logo-subtitle {
            margin-top: 5px;
            font-size: 8px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #64748b;
        }

        nav a {
            text-decoration: none;
            color: #172554;
            margin-left: 10px;
            padding: 10px 15px;
            border-radius: 12px;
            font-size: 14px;
            transition: 0.3s;
        }

        nav a:hover {
            background: #2563eb;
            color: white;
        }

        /* Login Section */
        .container {
            width: 90%;
            max-width: 450px;
            margin: 50px auto;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 25px;
        }

        .login-box {
            background-color: white;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 30px;
        }

        .login-box h2 {
            font-size: 24px;
            margin-bottom: 25px;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #333;
            border-radius: 5px;
            font-size: 14px;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            background-color: #e5e5e5;
            border: 1px solid #333;
            border-radius: 5px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-box button:hover {
            background-color: #ff6b00;
            color: white;
        }

        .forgot {
            display: block;
            margin-top: 22px;
            font-size: 13px;
            color: #333;
            text-decoration: none;
        }

        .forgot:hover {
            color: #ff6b00;
        }

        .signup-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
        }

        .signup-link a {
            color: #ff6b00;
            font-weight: bold;
            text-decoration: none;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        /* Footer */
        footer {
            margin-top: 70px;
            background: #172554;
            padding: 30px 20px;
            text-align: center;
            color: #cbd5e1;
        }

        footer h2 {
            color: #06b6d4;
            font-size: 24px;
            margin-bottom: 8px;
        }

        footer h2 span {
            color: #ff6b00;
        }

        footer p {
            margin-top: 8px;
            font-size: 14px;
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            nav {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 5px;
            }

            nav a {
                margin: 0 3px;
            }

            .container {
                margin-top: 30px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <div class="logo-icon">🚗</div>
            <div class="logo-text">
                <div class="logo-title">
                    <span class="drive">DRIVE</span>
                    <span class="bolt">⚡</span>
                    <span class="easy">EASY</span>
                </div>
                <div class="logo-line"></div>
                <div class="logo-subtitle" style="margin-left: 20px;">VEHICLE RENTAL SYSTEM</div>
            </div>
        </div>
        <nav>
            <a href="../index.html">← Back</a>
        </nav>
    </header>

    <!-- Login Section -->
    <div class="container">
        <h1>Login / Sign In</h1>

        <div class="login-box">
            <h2>LOGIN</h2>

            <form action="vehical_listing_page.html" onsubmit="return validateLogin()" novalidate>
                <input type="email" id="email" name="email" placeholder="Email">

                <input type="password" id="password" name="password" placeholder="Password">

                <button type="submit">LOGIN</button>
            </form>

            <a href="#" class="forgot"
                onclick="alert('Please contact the administrator to reset your password.'); return false;">
                Forgot Password?
            </a>

            <div class="signup-link">
                Don't have an account?
                <a href="sign_up.html">Sign Up</a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <h2>DRIVE <span>⚡</span> EASY</h2>
        <p>VEHICLE RENTAL SYSTEM</p>
        <p>© 2026 Drive Easy. All Rights Reserved.</p>
        <p>Ride Smart · Ride Safe · Ride Easy 🚗</p>
    </footer>

    <script>
        function validateLogin() {

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            if (email === "") {
                alert("Please enter your email address.");
                return false;
            }

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                alert("Please enter a valid email address.");
                return false;
            }

            if (password.trim() === "") {
                alert("Please enter your password.");
                return false;
            }

            return true;
        }
    </script>

</body>

</html>
